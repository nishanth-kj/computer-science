name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests cancel their own superseded runs; a deploy on main is never cancelled midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      # Same pipeline as production (sitemap, ng build, prerender, 404.html); proves it builds on every PR.
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # base_url / base_path come from the repository's Pages settings: a project site is served under
      # /<repo>/, a custom domain from the root. The app must be built for whichever applies.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build for Pages
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
          BASE_HREF: ${{ steps.pages.outputs.base_path }}/
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          ADSENSE_IN_ARTICLE_SLOT: ${{ vars.ADSENSE_IN_ARTICLE_SLOT }}
          ADSENSE_LIBRARY_SLOT: ${{ vars.ADSENSE_LIBRARY_SLOT }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          DIGITAL_PRODUCTS_URL: ${{ vars.DIGITAL_PRODUCTS_URL }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
        run: |
          node scripts/generate-sitemap.mjs
          npx ng build --base-href "$BASE_HREF"
          node scripts/configure-site.mjs
          node scripts/prerender.mjs
          node scripts/audit-built-site.mjs
          node scripts/audit-editorial-content.mjs
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

@if (phase(); as p) {
  <div class="w-full max-w-5xl px-4 py-8 sm:px-6 md:px-8 lg:px-12">
    <p class="font-mono text-xs text-muted uppercase">{{ p.title }}</p>
    <h1 class="mt-2 font-display text-4xl tracking-tight">{{ p.subtitle }}</h1>
    <p class="mt-3 text-lg text-muted">{{ p.blurb }}</p>
    <p class="mt-4 font-mono text-xs text-subtle">{{ total() }} pages &middot; {{ groups().length }} fields</p>

    <div class="mt-10 space-y-12">
      @for (g of groups(); track g.id; let i = $index) {
        <section>
          <div class="flex items-baseline gap-3 border-b border-border pb-2">
            <span class="font-mono text-xs text-subtle tabular-nums">{{ pad(i + 1) }}</span>
            <h2 class="font-display text-2xl tracking-tight">
              <a [routerLink]="g.href" class="hover:underline">{{ g.title }}</a>
            </h2>
            <span class="ml-auto font-mono text-xs text-subtle tabular-nums">{{ g.count }} pages</span>
          </div>
          <div class="mt-4">
            <cs-group-view [id]="g.id" />
          </div>
        </section>
      }
    </div>
  </div>
} @else {
  <div class="mx-auto max-w-lg px-4 py-24 text-center">
    <p class="font-mono text-xs text-muted">404</p>
    <h1 class="mt-2 font-display text-3xl">This page was not found</h1>
    <a routerLink="/" class="mt-6 inline-block text-sm text-link hover:underline">Back to home</a>
  </div>
}

<div class="w-full px-4 py-8 sm:px-6 md:px-8 lg:px-12">
  <h1 class="font-display text-4xl tracking-tight">Learning paths</h1>
  <p class="mt-2 text-muted">The path through the catalog. Each step is a full page; finish one, take the next.</p>
  <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (p of paths; track p.id) {
      <a [routerLink]="'/paths/' + p.id" class="block group">
        <div class="h-full flex flex-col justify-between rounded-xl border border-border bg-surface p-5 shadow-[var(--shadow-border)] transition-all hover:bg-surface-2 hover:border-fg/20">
          <div>
            <p class="text-xs text-muted uppercase tracking-wider font-mono">{{ p.audience }}</p>
            <h2 class="mt-1 font-display text-2xl group-hover:text-link transition-colors">{{ p.title }}</h2>
            <p class="mt-1 text-sm text-muted">{{ p.blurb }}</p>
          </div>
          <div class="mt-5 pt-3 border-t border-border/60">
            <div class="flex items-center justify-between text-xs text-muted mb-1.5">
              <span>Progress</span>
              <span class="font-mono tabular-nums">{{ completedFor(p.slugs) }} / {{ p.slugs.length }}</span>
            </div>
            <div class="h-1.5 w-full rounded-full bg-surface-2 overflow-hidden border border-border/50">
              <div
                class="h-full bg-emerald-500 rounded-full transition-all duration-300"
                [style.width.%]="percentFor(p.slugs)"
              ></div>
            </div>
          </div>
        </div>
      </a>
    }
  </div>
</div>

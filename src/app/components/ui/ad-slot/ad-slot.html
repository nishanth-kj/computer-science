<aside class="ad-container" role="complementary" aria-label="Advertisement">
  <span class="ad-label">Advertisement</span>
  <div class="ad-slot" [class]="'ad-slot--' + format()">
    <ins
      class="adsbygoogle"
      style="display:block"
      [attr.data-ad-client]="'ca-pub-0000000000000000'"
      [attr.data-ad-slot]="slot()"
      [attr.data-ad-format]="format()"
      [attr.data-full-width-responsive]="'true'"
    ></ins>
  </div>
</aside>

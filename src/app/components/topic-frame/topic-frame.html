<div class="frame" [class.frame--open]="sidebar.open()">
  <aside class="frame__sidebar">
    @if (sidebar.open()) {
      <div class="frame__sidebar-bar">
        <span>Library</span>
      </div>
      <cs-sidebar />
    }
    <button
      type="button"
      class="frame__rail-btn"
      [attr.aria-expanded]="sidebar.open()"
      [attr.aria-label]="sidebar.open() ? 'Close library' : 'Open library'"
      title="Library ([)"
      (click)="sidebar.toggle()"
    >
      <cs-icon name="chevron" />
    </button>
  </aside>
  @if (sidebar.open()) {
    <div class="frame__drawer">
      <button type="button" class="frame__scrim" aria-label="Close library" (click)="sidebar.hide()"></button>
      <div class="frame__sheet">
        <button type="button" class="frame__icon-btn frame__sheet-close" aria-label="Close library" (click)="sidebar.hide()">
          <cs-icon name="x" />
        </button>
        <cs-sidebar (navigated)="sidebar.hideOverlay()" />
      </div>
    </div>
  }
  <div class="frame__content scroll">
    <div class="frame__stack">
      <div class="frame__page">
        <cs-breadcrumb />
        <ng-content />
      </div>
      <cs-footer />
    </div>
  </div>
</div>

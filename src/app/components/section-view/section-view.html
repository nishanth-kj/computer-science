@if (section()) {
  <div class="w-full max-w-5xl px-4 py-8 sm:px-6 md:px-8 lg:px-12">
    <p class="font-mono text-xs text-muted uppercase">Section</p>
    <h1 class="mt-2 font-display text-4xl tracking-tight">{{ section()!.title }}</h1>
    <p class="mt-3 text-lg text-muted">{{ section()!.blurb }}</p>
    @if (graph().nodes.length > 1) {
      <div class="mt-8">
        <cs-graph
          [nodes]="graph().nodes"
          [edges]="graph().edges"
          layout="radial"
          [label]="section()!.title + ' graph'"
          [legend]="['Dashed: prerequisite', 'Solid: related']"
        />
      </div>
    }
    <ol class="mt-8 divide-y divide-border border-y border-border">
      @for (t of paged(); track t.slug; let i = $index) {
        <li>
          <a [routerLink]="topicHref(t.slug)" class="flex gap-4 py-3 hover:bg-surface-2/60">
            <span class="w-8 font-mono text-xs text-subtle tabular-nums">{{ pad((page() - 1) * pageSize + i + 1) }}</span>
            <span class="min-w-0">
              <span class="block text-sm font-medium">{{ t.title }}</span>
              <span class="block text-xs text-muted">{{ t.summary }}</span>
            </span>
          </a>
        </li>
      }
    </ol>
    <cs-pagination [total]="topics().length" [pageSize]="pageSize" [(page)]="page" />
  </div>
}

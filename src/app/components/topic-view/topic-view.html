@if (topic()) {
  <div class="w-full px-4 py-8 sm:px-6 md:px-8 lg:px-12">
    <div class="flex items-start gap-8 xl:gap-14">
      <div class="min-w-0 flex-1 max-w-4xl">
        <div class="mb-5 flex items-center justify-end border-b border-border/70 pb-3.5">
          <button
            type="button"
            class="inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-3 text-xs text-muted hover:bg-surface-2 hover:text-fg transition-colors"
            [class.bg-surface-2]="bookmarked()"
            [class.text-fg]="bookmarked()"
            (click)="toggleBookmark()"
            title="Bookmark this topic"
          >
            <cs-icon name="bookmark" class="size-3.5" />
            {{ bookmarked() ? "Saved" : "Save" }}
          </button>
        </div>
        <cs-article [topic]="topic()!" />
      </div>
      <aside class="hidden w-64 shrink-0 xl:block sticky top-8">
        <cs-toc />
      </aside>
    </div>
  </div>
} @else {
  <div class="mx-auto max-w-lg px-4 py-24 text-center">
    <p class="font-mono text-xs text-muted">404</p>
    <h1 class="mt-2 font-display text-3xl">This page was not found</h1>
    <a routerLink="/" class="mt-6 inline-block text-sm text-link hover:underline">Back to home</a>
  </div>
}

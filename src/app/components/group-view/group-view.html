<div class="grid gap-4 sm:grid-cols-2">
  @for (s of sections(); track s.id) {
    <div
      class="rounded-xl border border-border bg-surface p-5 shadow-[var(--shadow-border)]"
      [class.sm:col-span-2]="sections().length === 1"
    >
      <div class="flex items-baseline justify-between gap-3">
        <h3 class="font-display text-xl">
          <a [routerLink]="topicHref(s.id)" class="hover:underline">{{ s.title }}</a>
        </h3>
        <span class="font-mono text-xs text-subtle tabular-nums" [attr.title]="s.read + ' of ' + s.total + ' pages read'">
          {{ s.read }}/{{ s.total }}
        </span>
      </div>
      <p class="mt-1 text-sm text-muted">{{ s.blurb }}</p>
      <ul class="mt-4 flex flex-wrap gap-1.5">
        @for (t of s.shown; track t.slug) {
          <li>
            <a
              [routerLink]="topicHref(t.slug)"
              class="inline-block rounded-full border px-2.5 py-1 text-xs hover:bg-surface-2"
              [class.border-border]="!progress.isVisited(t.slug)"
              [class.border-emerald-500/40]="progress.isVisited(t.slug)"
              >{{ t.title }}</a
            >
          </li>
        }
        @if (s.more > 0) {
          <li>
            <a [routerLink]="topicHref(s.id)" class="inline-block px-2 py-1 text-xs text-link hover:underline"
              >+ {{ s.more }} more &rarr;</a
            >
          </li>
        }
      </ul>
    </div>
  }
</div>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CS — Computer science topics</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Computer science topics — programming languages, networks, operating systems, databases, algorithms, and more."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cs-atlas-theme");
          var d = true;
          if (t) {
            var p = JSON.parse(t);
            if (p && p.state && p.state.theme === "light") d = false;
          }
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-bg font-sans text-fg antialiased">
    <app-root></app-root>
  </body>
</html>
